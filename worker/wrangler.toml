name = "blog-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Restrict which site can call this API. While testing locally you can leave
# this as "*". For production, set it to your real site origin, e.g.
#   ALLOWED_ORIGIN = "https://my-blog.pages.dev"
[vars]
ALLOWED_ORIGIN = "*"

# D1 database binding. Fill in database_id after you run:
#   npx wrangler d1 create blog-db
# Wrangler will print the database_id — paste it below.
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "7010681c-77b0-4934-91bf-51c2d2a68135"

# Refreshes price_snapshots once a day, after NSE/BSE close (15:30 IST).
# 10:15 UTC = 15:45 IST, Mon-Fri.
[triggers]
crons = ["15 10 * * 1-5"]

# ADMIN_TOKEN protects the write endpoints used to add/remove holdings
# and manage the watchlist (everything else stays public, read-only).
# Set it with:
#   npx wrangler secret put ADMIN_TOKEN
# and for local dev, add it to worker/.dev.vars as ADMIN_TOKEN=...
