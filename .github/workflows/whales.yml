# Rebuilds the static Capital Flows data (public/data/flows: deals by day,
# stock and client) and the investor leaderboard from the bulk/block deals the
# Worker stores in D1, and commits them when they changed. Incremental: only
# deals newer than the committed files are read from D1. The push triggers the
# Cloudflare Pages deploy, so the public pages never query D1. Runs after the
# Worker's 8 PM IST (14:30 UTC) fetch of the day's NSE/BSE deals.
name: Rebuild capital flows data

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whales
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build capital flows data and leaderboard from the API
        run: node scripts/build-capital-flows.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "Capital flows data unchanged."
            exit 0
          fi
          through=$(node -e "const d=require('./public/data/whales-summary.json').dataThrough;console.log(Object.entries(d).map(([k,v])=>k+' '+v).join(', '))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/flows public/data/whales-summary.json public/data/client-meta.json public/data/prop-clients.json
          git commit -m "Update capital flows data (through $through)"
          git push
