# Rebuilds the static Capital Flows data (public/data/flows: deals by day,
# stock and client) and the investor leaderboard from the bulk/block deals the
# Worker stores in D1, and commits them when they changed. Incremental: only
# deals newer than the committed files are read from D1. The push triggers the
# Cloudflare Pages deploy, so the public pages never query D1. Runs after the
# Worker's 8 PM IST (14:30 UTC) fetch of the day's NSE/BSE deals.
# Also refreshes quarterly mutual-fund ownership (public/data/ownership) from
# NSE shareholding filings for /ownership. To backfill, run it manually with
# `ownership_since` (e.g. 2024-12-01) and repeat until nothing is left.
name: Rebuild capital flows data

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      ownership_since:
        description: 'List shareholding filings broadcast since (YYYY-MM-DD); empty = last 30 days'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: whales
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # A run queued behind another (see `concurrency`) must start from the data
          # that run committed, not from the commit it was triggered on.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build capital flows data and leaderboard from the API
        run: node scripts/build-capital-flows.mjs
      - name: Build mutual fund ownership from NSE shareholding filings
        # Independent of the deals above: a failure here must not stop their commit.
        continue-on-error: true
        env:
          SINCE: ${{ inputs.ownership_since }}
        run: node scripts/build-mf-ownership.mjs ${SINCE:+--since "$SINCE"}
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "Capital flows data unchanged."
            exit 0
          fi
          through=$(node -e "const d=require('./public/data/whales-summary.json').dataThrough;console.log(Object.entries(d).map(([k,v])=>k+' '+v).join(', '))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/flows public/data/ownership public/data/whales-summary.json public/data/client-meta.json public/data/prop-clients.json
          git commit -m "Update capital flows data (through $through)"
          # Something else may have landed on main meanwhile; replay this commit on top.
          git push || { git pull --rebase origin main && git push; }
